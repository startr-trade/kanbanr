name: CI

# Continuous integration for the kanbanr monorepo:
#   - api/  Rust workspace (kanbanr-core, kanbanr-cli [bin], kanbanr-server [lib])
#   - web/  React + Vite app
#
# NOTE: The Rust build links a VENDORED libgit2 and a VENDORED OpenSSL, both
# compiled from source. That means the CI machines need a full C toolchain
# (cmake + make + a C compiler + perl) and the first build is heavy and slow.
# Caching (Swatinem/rust-cache) keeps subsequent runs reasonable, but expect
# the cold build to take a while — this is expected, not a hang.

on:
  push:
  pull_request:

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Don't cancel the whole matrix if one OS fails — we want to see all of them.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    defaults:
      run:
        # All Rust commands run from the workspace root in api/.
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry / build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # The workspace lives in api/, not at the repo root.
          workspaces: "api"

      # --- Build dependencies for the vendored C libraries (libgit2 + OpenSSL) ---
      # These are needed to compile the vendored sources from scratch.

      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake make perl gcc

      - name: Install build deps (macOS)
        if: runner.os == 'macOS'
        # perl is preinstalled on the macOS runners; we just need cmake.
        run: brew install cmake

      # On the Windows runners, cmake and Strawberry Perl are preinstalled, and
      # perl is already on PATH (which is what vendored OpenSSL's Configure
      # script needs). We verify it here so that if a future runner image drops
      # perl, this step fails loudly with a clear message instead of producing a
      # confusing OpenSSL build error. If perl is ever missing, install it with:
      #   choco install strawberryperl
      # and prepend C:\Strawberry\perl\bin to GITHUB_PATH.
      - name: Verify build deps (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake --version
          perl --version

      # --- Lint + format checks: run on Ubuntu only to keep the matrix fast. ---

      - name: Check formatting (ubuntu only)
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Clippy (ubuntu only)
        if: runner.os == 'Linux'
        run: cargo clippy --workspace -- -D warnings

      # --- Tests: run on every OS in the matrix. ---

      - name: Test
        run: cargo test --workspace

  # A contribution states why it exists and proves each requirement with a green test
  # (CONTRIBUTING.md). The definition travels in the PR body, because a contributor has no board
  # access, and `kanbanr check --file` validates it on its own.
  definition:
    name: definition
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Extract the definition from the PR body
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$BODY" | awk '/^```yaml/{flag=1;next}/^```/{flag=0}flag' > definition.yaml
          if [ ! -s definition.yaml ]; then
            echo "No definition block found in the PR body."
            echo "Fill in the Definition section of the template — see CONTRIBUTING.md."
            exit 1
          fi
          cat definition.yaml
      - name: Build the CLI
        run: cd api && cargo build --release -p kanbanr-cli
      - name: Check it against the bar
        run: ./api/target/release/kanbanr check --file definition.yaml

  web:
    name: web
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Prefer a clean, lockfile-respecting install; fall back to a plain
      # install if the lockfile is out of sync with package.json.
      - name: Install dependencies
        run: npm ci || npm install

      - name: Build
        run: npm run build

      # A mermaid diagram that does not parse renders as nothing, and nothing reads as a missing
      # image rather than a syntax error — so it survives review. Parse them with the same library
      # the monitor renders them with.
      - name: Docs diagrams parse
        run: npm run check:docs

      # A control has to look like a control, and a destination is offered once. Both are
      # greppable rules that decay silently in review (L-21) — see ADR-0008.
      - name: The monitor presents itself correctly
        run: npm run check:ui

  # The installers are the first thing a stranger runs, and they run as root on a machine we will
  # never see. Static checks are cheap; the end-to-end run against a real release lives in
  # release.yml's verify-install job, because it needs a release to install.
  installers:
    name: installers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # shellcheck catches the class of bug that has cost installers real debugging: a helper
      # whose `[ -n "$x" ] && printf …` returns 1 when the value is empty, aborting the caller
      # under `set -e` while `|| true` hides it.
      # The binary must be able to make an HTTPS request (FEAT-088/R-6). `ureq` was declared with
      # default-features = false and no tls feature, leaving it with no backend at all — every
      # https:// call failed, and nothing noticed because no test used one.
      - name: The CLI links a TLS backend
        working-directory: api
        run: |
          set -eu
          cargo tree -p kanbanr-cli -e normal -i rustls \
            || { echo "::error::kanbanr-cli has no TLS backend — self-update and https webhooks cannot work" >&2; exit 1; }

      - name: shellcheck install.sh
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck --shell=sh --severity=warning scripts/install.sh

      # pwsh is preinstalled on GitHub's ubuntu runners. Parsing is not running, but it catches
      # the unbalanced-quote and bad-cmdlet mistakes that would otherwise only surface on a
      # Windows machine we are not testing on.
      - name: install.ps1 parses
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "scripts/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          Write-Host "install.ps1 parses clean"

      # Updates over plaintext are not made safe by a checksum — SHA256SUMS arrives over the same
      # channel (FEAT-089). curl's -L follows redirects and a release download IS one, so the
      # protocol has to be pinned on the redirect as well as the request.
      - name: The installers pin https on request and redirect
        run: |
          set -eu
          grep -q -- "--proto =https" scripts/install.sh \
            || { echo "::error::install.sh does not pin https on the request" >&2; exit 1; }
          grep -q -- "--proto-redir =https" scripts/install.sh \
            || { echo "::error::install.sh does not pin https on redirects" >&2; exit 1; }
          grep -q "require_https" scripts/install.sh \
            || { echo "::error::install.sh does not refuse a non-https URL" >&2; exit 1; }
          grep -q "Assert-Https" scripts/install.ps1 \
            || { echo "::error::install.ps1 does not refuse a non-https URL" >&2; exit 1; }
          # Every fetch must go through the checked helper, not straight to the cmdlet.
          if grep -n "Invoke-WebRequest -Uri" scripts/install.ps1; then
            echo "::error::install.ps1 fetches without checking the scheme" >&2; exit 1
          fi
          # And no http:// URL anywhere in either script.
          if grep -nE "http://[a-z]" scripts/install.sh scripts/install.ps1; then
            echo "::error::a plaintext URL in an installer" >&2; exit 1
          fi
          echo "installers pin https on request and redirect."

      # Every platform the shell installer claims to support must be one the release workflow
      # actually builds. They drifted apart once already, in the other direction — the script
      # promised linux/aarch64 that release.yml did not produce.
      - name: The installer's targets are the targets we publish
        run: |
          set -eu
          published=$(grep -oE 'target: [a-z0-9_-]+' .github/workflows/release.yml | awk '{print $2}' | sort -u)
          # Match the triple itself rather than the assignment: the two scripts spell it
          # differently (`TARGET="…"` in sh, `$target = '…'` in PowerShell), and a pattern tied to
          # one spelling silently checks only that file — which is how a check passes while
          # covering half of what it claims.
          claimed=$(grep -ohE '(x86_64|aarch64)-[a-z0-9]+-[a-z0-9]+(-[a-z0-9]+)?' \
            scripts/install.sh scripts/install.ps1 | sort -u)
          echo "published:"; echo "$published"
          echo "claimed:";   echo "$claimed"
          for t in $claimed; do
            echo "$published" | grep -qx "$t" \
              || { echo "::error::install script offers $t, which release.yml does not build" >&2; exit 1; }
          done

name: CI

# Continuous integration for the kanbanr monorepo:
#   - api/  Rust workspace (kanbanr-core, kanbanr-cli [bin], kanbanr-server [lib])
#   - web/  React + Vite app
#
# NOTE: The Rust build links a VENDORED libgit2 and a VENDORED OpenSSL, both
# compiled from source. That means the CI machines need a full C toolchain
# (cmake + make + a C compiler + perl) and the first build is heavy and slow.
# Caching (Swatinem/rust-cache) keeps subsequent runs reasonable, but expect
# the cold build to take a while — this is expected, not a hang.

# One run per change (FEAT-130): a push to main, or a pull request. A pull request's branch used to
# run twice — once for the push, once for the pull request — and every branch pushed ran the full
# matrix, macOS included, which a private repository pays ten times the Linux rate for.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer run for the same branch or pull request makes the older one pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The CI build environment (MNT-007): no incremental files and no debug info, so links are faster,
# the cache is smaller and a cold build never fills the runner's disk. A local `make ci` reads it too.
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A hung test fails within the hour (MNT-007); the cold build with vendored C takes about 25
    # minutes on Windows.
    timeout-minutes: 60
    strategy:
      # Don't cancel the whole matrix if one OS fails — we want to see all of them.
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]

    defaults:
      run:
        # All Rust commands run from the workspace root in api/.
        working-directory: api

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          # rust-toolchain.toml's channel, named here too (test_pipeline_practices.Toolchain).
          toolchain: "1.98.1"
          components: rustfmt, clippy

      - name: Cache cargo registry / build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # The workspace lives in api/, not at the repo root.
          workspaces: "api"
          # One cache per runner image, saved only from main: a pull request restores main's cache
          # and never saves its own (MNT-007).
          shared-key: ci-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The tests run through cargo-nextest (MNT-010), pinned: FTR-058's reader parses its lines,
      # so an upgrade is a deliberate bump, not a surprise.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-nextest@0.9.151

      # --- Build dependencies for the vendored C libraries (libgit2 + OpenSSL) ---
      # These are needed to compile the vendored sources from scratch.

      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake make perl gcc

      - name: Install build deps (macOS)
        if: runner.os == 'macOS'
        # perl is preinstalled on the macOS runners; we just need cmake.
        run: brew install cmake

      # On the Windows runners, cmake and Strawberry Perl are preinstalled, and
      # perl is already on PATH (which is what vendored OpenSSL's Configure
      # script needs). We verify it here so that if a future runner image drops
      # perl, this step fails loudly with a clear message instead of producing a
      # confusing OpenSSL build error. If perl is ever missing, install it with:
      #   choco install strawberryperl
      # and prepend C:\Strawberry\perl\bin to GITHUB_PATH.
      - name: Verify build deps (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake --version
          perl --version

      # --- The monitor, embedded into the binary under test (FEAT-129/R-1) ---
      # kanbanr-server's build.rs embeds web/dist when it exists and embeds nothing when it does
      # not (ADR-0009). Without this, every test ran against a monitor-less binary — the one
      # thing a release never ships — and the test that asserts the monitor is served failed here
      # while passing on any machine that had built the web app once.
      - name: Install Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the monitor (web/dist)
        working-directory: web
        run: |
          npm ci
          npm run build

      # --- Lint + format checks: run on Ubuntu only to keep the matrix fast. ---

      - name: Check formatting (ubuntu only)
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Clippy (ubuntu only)
        if: runner.os == 'Linux'
        run: cargo clippy --locked --workspace -- -D warnings

      # The read API's description is generated from the response types and committed (FEAT-177):
      # a response type that changed without the document being regenerated fails here.
      - name: The published OpenAPI matches the code
        if: runner.os == 'Linux'
        run: cargo run --locked -p kanbanr-core --features schema --example openapi -- --check

      # --- Tests: run on every OS in the matrix. ---

      # --no-fail-fast: every test binary runs even after one fails, so a platform's failures all
      # show in one run. Without it Windows revealed its failures one test binary per push.
      # scripts/test.sh runs cargo-nextest when it is installed, and the doctests after it (MNT-010).
      - name: Test
        shell: bash
        run: ../scripts/test.sh

      # Every test has its time in the run's JUnit report (api/.config/nextest.toml). Checked on
      # Linux, where python3 is python3; the report is written on every system.
      - name: The run left a JUnit report with a time for every test
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: python3 ../scripts/check_junit.py target/nextest/default/junit.xml

      # Kept as raw data, a red run's too: each test's duration on each system.
      - name: Keep the JUnit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: junit-${{ matrix.os }}
          path: api/target/nextest/default/junit.xml
          if-no-files-found: warn

      # DEF-058: build.rs must restamp a build in a linked git worktree after HEAD moves. The test
      # clones the repository, so it is #[ignore]d in the workspace run above (a minute or two) and
      # runs here, on Linux only: the fix is in build.rs, not the platform.
      - name: Build stamp follows HEAD in a worktree
        if: runner.os == 'Linux'
        shell: bash
        run: ../scripts/test.sh --ignored -p kanbanr-cli --test build_stamp

  # A contribution states why it exists and proves each requirement with a green test
  # (CONTRIBUTING.md). The definition travels in the PR body, because a contributor has no board
  # access, and `kanbanr check --file` validates it on its own.
  definition:
    name: definition
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Extract the definition from the PR body
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$BODY" | awk '/^```yaml/{flag=1;next}/^```/{flag=0}flag' > definition.yaml
          if [ ! -s definition.yaml ]; then
            echo "No definition block found in the PR body."
            echo "Fill in the Definition section of the template — see CONTRIBUTING.md."
            exit 1
          fi
          cat definition.yaml
      - name: Build the CLI
        # Only `kanbanr check` is needed here, not the monitor (FEAT-202).
        env:
          KANBANR_ALLOW_BARE_BUILD: "1"
        run: cd api && cargo build --locked --release -p kanbanr-cli
      - name: Check it against the bar
        run: ./api/target/release/kanbanr check --file definition.yaml

  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Prefer a clean, lockfile-respecting install; fall back to a plain
      # install if the lockfile is out of sync with package.json.
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # A diagram that does not parse renders as nothing, and nothing reads as a missing image
      # rather than a syntax error — so it survives review. Draw every one with the same pinned Pele
      # the book and the monitor use, and check the book's copy of Pele is that build (FEAT-203).
      - name: Docs diagrams parse
        run: npm run check:docs

      # The Rust diagram lint flags only what Pele rejects (FEAT-200): its fixture, parsed by the
      # real Pele, must fail exactly where the lint names a rule.
      - name: The diagram lint agrees with Pele
        run: npm run check:diagram-lint

      # The review page parses every diagram an item's brief covers and keeps Approve disabled until
      # all of them parse; a diagram that does not draw shows its error with its line (FEAT-200).
      - name: The review page checks diagrams before Approve
        run: npm run check:diagram-review

      # A control has to look like a control, and a destination is offered once. Both are
      # greppable rules that decay silently in review (L-21) — see ADR-0008.
      - name: The monitor presents itself correctly
        run: npm run check:ui

      # A shared board's documents are written by whoever can push to it, and the monitor can
      # write (FEAT-140): markdown that would run script must come out of the renderer without it.
      - name: The monitor's markdown cannot run script
        run: npm run check:markdown

      # The standalone bundle points the monitor at a daemon elsewhere (FEAT-178): every URL must
      # follow config.json's apiBase, and the shipped standalone configuration must offer no decision.
      - name: Every request goes to the configured API base
        run: npm run check:api-base
      - name: The standalone monitor is read-only
        run: npm run check:read-only
      # A card never reads as a status, and never says ready while work is open (FEAT-205).
      - name: Board cards say what is next in plain words
        run: npm run check:card-text
      # Each release has one button named for its next step, enabled only when its plan is ready,
      # and none when nothing is planned into it (FEAT-212).
      - name: Each release's button says what it does
        run: npm run check:release-action
      # A candidate whose release-prepare configuration changed offers Promote to candidate again
      # (DEF-057).
      - name: A candidate whose preparation changed offers Promote to candidate again
        run: npm run check:release-again
      # A release button names the release and the stage, and a direct press asks before it acts
      # (DEF-034).
      - name: A release button names the release and asks first
        run: npm run check:release-confirm
      # A release's notes show on the Releases page, editable only on a write-enabled monitor before
      # the cut (FEAT-216).
      - name: A release's notes show and are edited from the Releases page
        run: npm run check:release-notes
      # An item's page says which release shipped it, so Completed is not read as released
      # (FTR-001).
      - name: An item says which release it shipped in
        run: npm run check:release-line
      # The board's Sprint filter can show only the items in no sprint (FTR-032).
      - name: The board can show the items in no sprint
        run: npm run check:sprint-filter
      # The Milestones page lists the newest milestone first (FTR-031).
      - name: Milestones are listed newest first
        run: npm run check:milestone-order
      # The header shows the kanbanr version and commit the monitor runs, and warns when the board
      # was last written by a newer one (FTR-036).
      - name: The header shows the running kanbanr and warns when the board is ahead
        run: npm run check:build-info
      # What Claude prepared for a decision shows filled in beside its button, with its sources as
      # links, and is edited or rejected only on request (FTR-034).
      - name: A prepared record shows filled in beside its button
        run: npm run check:prepared
      # A disabled Approve or Ratify says beneath it what is missing and who provides it (DEF-064).
      - name: A disabled Approve or Ratify button says what is missing and who provides it
        run: npm run check:review-blocked
      # Claude settles the texts to check; the Review page shows what is left and offers docs-folded
      # only when none is, with no form for the person (DEF-039).
      - name: The docs-folded sign-off asks for no form
        run: npm run check:texts-to-check
      # A manual test waiting for a person is listed on the Review page, with its requirement and
      # the check to make, and recorded there as passed or failed (DEF-040).
      - name: The Review page lists manual checks waiting for you
        run: npm run check:manual-tests
      # A walkthrough run's checks are prepared as one batch, confirmed or rejected with one click
      # beside the single buttons (FTR-037).
      - name: The Review page offers one click for a batch
        run: npm run check:review-batch
      # Each prepared result names the runbook's check id (MT-n), and the batch summary lists them,
      # so the person can match the Review page to the run log (DEF-089).
      - name: The Review page shows a result's check id
        run: npm run check:review-check-id
      # Rejecting or confirming a prepared answer shows its outcome and hides the form, and a
      # second press while the call is in flight sends nothing (DEF-090).
      - name: A prepared answer shows its outcome once
        run: npm run check:review-outcome
      # The Workflow page shows the cadence, the git model and every guard rail, each with the
      # command that changes it, and changes nothing itself (FEAT-213).
      - name: The Workflow page shows the cadence, the git model and the guard rails
        run: npm run check:workflow
      # Every agent scope and its state, on the item page, the Workflow page and the activity, with
      # no action offered: scopes are issued and revoked from the CLI (FEAT-214).
      - name: The monitor shows agent scopes and who made each change
        run: npm run check:agent-scopes
      # A burst of board changes settles before the live hook refetches, once rather than once per
      # change (DEF-022); the check existed and CI never ran it (DEF-081).
      - name: Live updates settle before the monitor refetches
        run: npm run check:live-settle
      # One shared cache serves every page: a read in flight is shared, a live change re-reads only
      # the slices it names, and loading is never drawn as empty (DEF-081).
      - name: The monitor's data cache shares reads and re-reads only changed slices
        run: npm run check:data-cache
      # The UI kit uses tokens only, on the type scale and severity palette the person chose
      # (FTR-046).
      - name: The UI kit is built on the chosen design tokens
        run: npm run check:ui-tokens
      # The kit's markup checks render components through Vite's SSR loader; the renderer must
      # work before they can (FTR-046).
      - name: The UI kit's renderer draws a component
        run: npm run check:ui-render
      # The project pages are grouped into areas, each listed once, with the current one marked,
      # and one menu open at a time that Escape closes (FTR-047).
      - name: The monitor's navigation lists every page once, grouped into areas
        run: npm run check:nav
      # The latest background drift result is labelled with its code revision and age, recomputing
      # while a newer run goes, and unavailable without a code repository (FTR-045).
      - name: The monitor labels background drift with its revision and age
        run: npm run check:drift-age
      # Tabs with counts open on the requested, preferred or largest tab, are a real tablist, and
      # mark the selected tab with an underline, never an accent fill (FTR-046).
      - name: The UI kit's tabs pick, render and underline correctly
        run: npm run check:ui-tabs
      # Every colour pair the monitor draws meets WCAG 2.1 AA in both themes: text 4.5:1, boundaries
      # and the focus ring 3:1 (DEF-082).
      - name: The monitor's colours meet WCAG 2.1 AA contrast
        run: npm run check:a11y-contrast
      # No text under 13 px: every font size in the monitor's CSS is a step of the type scale
      # (DEF-082).
      - name: The monitor draws no text under 13 px
        run: npm run check:a11y-type
      # The keyboard focus ring always shows: no rule drops the outline except for mouse focus,
      # and one :focus-visible ring covers every focusable element (DEF-082).
      - name: The monitor always shows the keyboard focus ring
        run: npm run check:a11y-focus
      # A delegation whose grant cannot be checked, because the board's history cannot be read,
      # says so and why on the Review page, not "not granted through kanbanr" (DEF-080).
      - name: The Review page says a grant cannot be checked and why
        run: npm run check:grant-unverifiable
      # Accordion rows render their body only when open, head it with a real heading holding the
      # toggle, and keep the open ids in the URL hash (FTR-046).
      - name: The UI kit's accordion rows open on demand under a heading
        run: npm run check:ui-accordion
      # The table sorts stably with nulls last, filters on every token, exports CSV quoted and with
      # formulas neutralised, and is drawn with a caption, aria-sort and a labelled filter (FTR-046).
      - name: The UI kit's table sorts, filters and exports correctly
        run: npm run check:ui-table
      # The matrix links each cell to its list, the timeline places dates in its window and keeps two
      # weeks around today, and the stepper marks done, current and next in text (FTR-046).
      - name: The UI kit's matrix, timeline and stepper draw their data correctly
        run: npm run check:ui-charts
      # Progress shares add up to 100, pills and tiles say their tone in text, and loading, error and
      # empty are distinct states, the empty one offering a sentence to copy (FTR-046).
      - name: The UI kit's figures and states say what they show in text
        run: npm run check:ui-figures
      # The Review page's groups carry counts and open on the largest, a selection stays inside one
      # group, a prepared batch arrives selected, and the URL names the group and open rows (FTR-038).
      - name: The Review page groups decisions
        run: npm run check:review-groups

      # The monitor reads the published read API (FEAT-177): every field api.ts's types read must
      # be one the route sends, as the OpenAPI document generated from the Rust types describes it.
      - name: The monitor's types match the published API
        run: npm run check:api-types

  # The VS Code extension ships in every release (FEAT-152), so a broken manifest or a version
  # that has drifted from the workspace's must fail here, not on a tag.
  vscode:
    name: VS Code extension
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: editor/vscode
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editor/vscode/package-lock.json
      - name: Install the extension's dependencies
        run: npm ci
      - name: The extension's version is the workspace's
        run: |
          set -eu
          ext="$(node -p "require('./package.json').version")"
          ws="$(sed -n 's/^version = "\(.*\)"$/\1/p' ../../api/Cargo.toml | head -n1)"
          [ "$ext" = "$ws" ] \
            || { echo "::error::editor/vscode/package.json says $ext, the workspace builds $ws" >&2; exit 1; }
      - name: The extension compiles and packages
        run: |
          set -eu
          out="$(mktemp -d)"
          npm run package -- -o "$out/kanbanr-vscode.vsix"
          test -s "$out/kanbanr-vscode.vsix"

  # The installers are the first thing a stranger runs, and they run as root on a machine we will
  # never see. Static checks are cheap; the end-to-end run against a real release lives in
  # release.yml's verify-install job, because it needs a release to install.
  installers:
    name: installers
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # shellcheck catches the class of bug that has cost installers real debugging: a helper
      # whose `[ -n "$x" ] && printf …` returns 1 when the value is empty, aborting the caller
      # under `set -e` while `|| true` hides it.
      # Installing and checking are separate steps so `make ci` can run the check exactly as
      # written here, with the shellcheck already on the machine (FEAT-131).
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: shellcheck the installer and its verifier
        run: shellcheck --shell=sh --severity=warning scripts/install.sh scripts/verify-install.sh scripts/check-tracked-files.sh

      # pwsh is preinstalled on GitHub's ubuntu runners. Parsing is not running, but it catches
      # the unbalanced-quote and bad-cmdlet mistakes that would otherwise only surface on a
      # Windows machine we are not testing on.
      - name: The PowerShell installer and its verifier parse
        shell: pwsh
        run: |
          foreach ($script in "scripts/install.ps1", "scripts/verify-install.ps1") {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $script, [ref]$null, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
            Write-Host "$script parses clean"
          }

      # Updates over plaintext are not made safe by a checksum — SHA256SUMS arrives over the same
      # channel (FEAT-089). curl's -L follows redirects and a release download IS one, so the
      # protocol has to be pinned on the redirect as well as the request.
      - name: The installers pin https on request and redirect
        run: |
          set -eu
          grep -q -- "--proto =https" scripts/install.sh \
            || { echo "::error::install.sh does not pin https on the request" >&2; exit 1; }
          grep -q -- "--proto-redir =https" scripts/install.sh \
            || { echo "::error::install.sh does not pin https on redirects" >&2; exit 1; }
          grep -q "require_https" scripts/install.sh \
            || { echo "::error::install.sh does not refuse a non-https URL" >&2; exit 1; }
          grep -q "Assert-Https" scripts/install.ps1 \
            || { echo "::error::install.ps1 does not refuse a non-https URL" >&2; exit 1; }
          # Every fetch must go through the checked helper, not straight to the cmdlet.
          if grep -n "Invoke-WebRequest -Uri" scripts/install.ps1; then
            echo "::error::install.ps1 fetches without checking the scheme" >&2; exit 1
          fi
          # And no http:// URL anywhere in either script.
          if grep -nE "http://[a-z]" scripts/install.sh scripts/install.ps1; then
            echo "::error::a plaintext URL in an installer" >&2; exit 1
          fi
          echo "installers pin https on request and redirect."

      # The installer installs the skill when Claude Code is there, and only then (FEAT-141). Its
      # skill step is run as written in install.sh — cut out between its markers, with the
      # script's own helpers — against a stub kanbanr that records what it was asked, in the
      # three cases that matter: claude on PATH, --no-skill, no claude.
      - name: The installer's skill step does what it says
        run: |
          set -eu
          work="$(mktemp -d)"
          { sed -n '/^die() /p;/^info() /p;/^have() /p' scripts/install.sh
            sed -n '/^# ---- the skill (FEAT-141)/,/^# ---- the editor extension/p' scripts/install.sh; } > "$work/step.sh"
          grep -q 'skill install' "$work/step.sh" || { echo "::error::no skill step found in install.sh" >&2; exit 1; }
          mkdir -p "$work/bin" "$work/claude"
          printf '#!/bin/sh\necho "$@" >> "%s/asked"\n' "$work" > "$work/bin/kanbanr"
          printf '#!/bin/sh\nexit 0\n' > "$work/claude/claude"
          chmod +x "$work/bin/kanbanr" "$work/claude/claude"
          run() { rm -f "$work/asked"; env -i PATH="$1:/usr/bin:/bin" INSTALL_DIR="$work/bin" NO_SKILL="$2" sh -c ". '$work/step.sh'" 2>"$work/said"; }
          run "$work/claude" ""
          [ "$(cat "$work/asked")" = "skill install" ] || { echo "::error::with claude present the skill was not installed" >&2; exit 1; }
          run "$work/claude" 1
          [ ! -e "$work/asked" ] || { echo "::error::--no-skill still installed the skill" >&2; exit 1; }
          grep -q "skipped" "$work/said"
          run "/nonexistent" ""
          [ ! -e "$work/asked" ] || { echo "::error::without claude the skill was installed anyway" >&2; exit 1; }
          grep -q "kanbanr skill install" "$work/said" || { echo "::error::without claude, no hint was given" >&2; exit 1; }
          echo "install.sh: installs the skill with claude present, skips it on --no-skill, hints without claude."

      # The editor extension is opt-in (FEAT-158): --vscode asks the program for every editor found,
      # --vscode=<editor> for that one, and without the option nothing is asked — only a hint, and
      # only when an editor is there. Cut out of install.sh as written and run against stubs.
      - name: The installer's editor step does what it says
        run: |
          set -eu
          work="$(mktemp -d)"
          { sed -n '/^die() /p;/^info() /p;/^have() /p' scripts/install.sh
            sed -n '/^# ---- the editor extension (FEAT-158)/,/^# ---- report/p' scripts/install.sh; } > "$work/step.sh"
          grep -q 'editor install' "$work/step.sh" || { echo "::error::no editor step found in install.sh" >&2; exit 1; }
          mkdir -p "$work/bin" "$work/editors"
          printf '#!/bin/sh\necho "$@" >> "%s/asked"\n' "$work" > "$work/bin/kanbanr"
          printf '#!/bin/sh\nexit 0\n' > "$work/editors/code"
          cp "$work/editors/code" "$work/editors/codium"
          chmod +x "$work/bin/kanbanr" "$work/editors/code" "$work/editors/codium"
          run() { rm -f "$work/asked"; env -i PATH="$1:/usr/bin:/bin" INSTALL_DIR="$work/bin" VSCODE="$2" sh -c ". '$work/step.sh'" 2>"$work/said"; }
          run "$work/editors" ""
          [ ! -e "$work/asked" ] || { echo "::error::without --vscode the extension was installed" >&2; exit 1; }
          grep -q -- "--vscode" "$work/said" || { echo "::error::with an editor present, no hint was given" >&2; exit 1; }
          run "$work/editors" 1
          [ "$(cat "$work/asked")" = "editor install" ] || { echo "::error::--vscode did not install into every editor" >&2; exit 1; }
          run "$work/editors" codium
          [ "$(cat "$work/asked")" = "editor install --editor codium" ] || { echo "::error::--vscode=codium did not name codium" >&2; exit 1; }
          run "/nonexistent" ""
          [ ! -e "$work/asked" ] && [ ! -s "$work/said" ] || { echo "::error::with no editor and no option, the step said or did something" >&2; exit 1; }
          echo "install.sh: --vscode installs into every editor, --vscode=<editor> into one, nothing without it."

      # Every platform the shell installer claims to support must be one the release workflow
      # actually builds. They drifted apart once already, in the other direction — the script
      # promised linux/aarch64 that release.yml did not produce.
      - name: The installer's targets are the targets we publish
        run: |
          set -eu
          published=$(grep -oE 'target: [a-z0-9_-]+' .github/workflows/release.yml | awk '{print $2}' | sort -u)
          # Match the triple itself rather than the assignment: the two scripts spell it
          # differently (`TARGET="…"` in sh, `$target = '…'` in PowerShell), and a pattern tied to
          # one spelling silently checks only that file — which is how a check passes while
          # covering half of what it claims.
          claimed=$(grep -ohE '(x86_64|aarch64)-[a-z0-9]+-[a-z0-9]+(-[a-z0-9]+)?' \
            scripts/install.sh scripts/install.ps1 | sort -u)
          echo "published:"; echo "$published"
          echo "claimed:";   echo "$claimed"
          for t in $claimed; do
            echo "$published" | grep -qx "$t" \
              || { echo "::error::install script offers $t, which release.yml does not build" >&2; exit 1; }
          done

  # The workflows themselves (FEAT-130). A third-party action named by a tag runs whatever that tag
  # points at on the day; a commit SHA runs what was reviewed. Updates are deliberate, since there
  # is no Dependabot here.
  workflows:
    name: workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # A merge tool's backup file is not source (MNT-006).
      - name: No tracked merge leftovers (*.orig, *.rej)
        run: |
          set -eu
          python3 -m unittest discover -s scripts/tests -p 'test_check_tracked_files.py' -v
          sh scripts/check-tracked-files.sh

      # The test runner, its config and the JUnit check follow the shared Rust CI practices (MNT-010;
      # MNT-007 adds its classes to the same file).
      - name: The pipeline follows the shared Rust CI practices
        run: python3 -m unittest discover -s scripts/tests -p 'test_pipeline_practices.py' -v && python3 -m unittest discover -s scripts/tests -p 'test_check_junit.py' -v

      # The guides cover designing a pipeline and describe a product by what a person does (DOC-007).
      - name: The guides cover the pipeline and a product people use
        run: python3 -m unittest discover -s scripts/tests -p 'test_guides.py' -v

      # The privacy scan lists what a public board would show (MNT-012).
      - name: The privacy scan's own tests pass
        run: python3 -m unittest discover -s scripts/tests -p 'test_privacy_scan.py' -v

      # The guide is docs/guide, the system representation docs/system, and the move from the old
      # source folder left no live reference behind (MNT-002).
      - name: The docs layout holds
        run: python3 -m unittest discover -s scripts/tests -p 'test_docs_layout.py' -v

      # Every check a gate can ask for has its behaviour described in the Working with Claude
      # chapter (FEAT-159): a new check cannot ship with nothing saying what Claude does about it.
      - name: Every gate check is described in Working with Claude
        run: |
          set -eu
          python3 - <<'PY'
          import re, sys
          src = open("api/crates/kanbanr-core/src/readiness.rs").read()
          body = src[src.index("pub enum Check {"):]
          body = body[:body.index("\n}")]
          names = [re.sub(r"(?<!^)(?=[A-Z])", "_", v).lower()
                   for v in re.findall(r"^\s{4}([A-Z][A-Za-z]+),", body, re.M)]
          chapter = open("docs/guide/using/with-claude.md").read()
          missing = [n for n in names if f"| `{n}` |" not in chapter]
          if missing:
              print("::error::docs/guide/using/with-claude.md does not describe: " + ", ".join(missing))
              sys.exit(1)
          print(f"all {len(names)} gate checks are described")
          PY

      # A tag for this version is refused without its notes (FEAT-154); this catches the gap on the
      # push that bumps the version, not on the tag.
      - name: The version being built has release notes
        run: |
          set -eu
          v="$(sed -n 's/^version = "\(.*\)"$/\1/p' api/Cargo.toml | head -n1)"
          test -s "docs/guide/releases/v$v.md" \
            || { echo "::error::no release notes for $v: write docs/guide/releases/v$v.md" >&2; exit 1; }
          grep -q "(v$v.md)" docs/guide/releases/index.md \
            || { echo "::error::docs/guide/releases/index.md does not list v$v" >&2; exit 1; }

      - name: Every third-party action is pinned to a commit
        run: |
          set -eu
          python3 - <<'PY'
          import glob, re, sys
          bad = []
          for path in sorted(glob.glob(".github/workflows/*.yml")):
              for n, line in enumerate(open(path), 1):
                  m = re.search(r"uses:\s+([^\s#]+)", line)
                  if not m or m.group(1).startswith("./"):
                      continue
                  ref = m.group(1).rpartition("@")[2]
                  if not re.fullmatch(r"[0-9a-f]{40}", ref) or "#" not in line:
                      bad.append(f"{path}:{n}: {m.group(1)}")
          for b in bad:
              print(f"::error::not pinned to a commit SHA with its version in a comment: {b}")
          sys.exit(1 if bad else 0)
          PY

      - name: Every scanner suppression has a reason and an expiry
        run: |
          set -eu
          python3 - <<'PY'
          import datetime, sys, yaml
          doc = yaml.safe_load(open(".trivyignore.yaml")) or {}
          bad = []
          for kind, entries in doc.items():
              for e in entries or []:
                  name = e.get("id") or e.get("path") or "?"
                  if not str(e.get("statement", "")).strip():
                      bad.append(f"{kind} {name}: no statement (the reason)")
                  exp = e.get("expired_at")
                  if not exp:
                      bad.append(f"{kind} {name}: no expired_at")
                  elif datetime.date.fromisoformat(str(exp)) < datetime.date.today():
                      bad.append(f"{kind} {name}: expired on {exp} — re-triage it")
          for b in bad:
              print(f"::error::.trivyignore.yaml {b}")
          sys.exit(1 if bad else 0)
          PY

      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo --entrypoint sh rhysd/actionlint:1.7.12 -c "actionlint -no-color .github/workflows/*.yml"

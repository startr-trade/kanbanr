name: Release

# Runs when you push a version tag, e.g.  git tag v0.1.0 && git push origin v0.1.0
#
# Produces, for that tag:
#   1. cross-platform `kanbanr` binaries attached to a GitHub Release
#   2. a multi-arch-capable Docker image pushed to GHCR (ghcr.io/startr-trade/kanbanr)
#   3. (optional) the CLI published to crates.io
#
# Secrets/setup required (see docs/OPEN_SOURCING.md → "Accounts, keys & credentials"):
#   - GHCR: none — uses the automatic GITHUB_TOKEN (needs `packages: write`, set below).
#   - crates.io: set repo secret CARGO_REGISTRY_TOKEN, OR configure Trusted Publishing and
#     drop the token line. The publish job is skipped automatically if the secret is absent.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the GitHub Release + upload assets
  packages: write   # push to GHCR

jobs:
  # ---- 0. The tag is the release's only input, so check it before anything runs ----
  #
  # Everything downstream derives from the tag: the asset names, the image tags, the version the
  # installer resolves. A malformed or mismatched tag therefore does not fail loudly — it produces
  # a complete, published, WRONG release. Cheaper to refuse here than to yank one.
  tag:
    name: check the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::expected a v-prefixed semver tag like v0.1.0, got '$tag'"; exit 1 ;;
          esac
          version="${tag#v}"

          # The tag must match the version actually being built, or you tag v0.2.0 and ship 0.1.0
          # — and the binary's own --version would then disagree with the release it sits in.
          #
          # Read from [workspace.package], because the crates all say `version.workspace = true`.
          # Reading the crate's own Cargo.toml returns the literal "version.workspace = true",
          # which compares unequal to every tag — a guard that refuses every valid release is
          # worse than none, and only running it caught that.
          crate="$(cargo metadata --no-deps --format-version 1 --manifest-path api/Cargo.toml \
            | python3 -c "import json,sys; m=json.load(sys.stdin); print(next(p['version'] for p in m['packages'] if p['name']=='kanbanr-cli'))")"
          if [ "$crate" != "$version" ]; then
            echo "::error::tag ${tag} names version ${version}, but the workspace builds ${crate}." >&2
            echo "::error::Set [workspace.package] version in api/Cargo.toml to ${version} and re-tag." >&2
            echo "::error::(For a pre-release, that means version = \"${version}\" — the binary's" >&2
            echo "::error:: own --version has to equal the tag it ships under, or the checksum and" >&2
            echo "::error:: commit provenance point at a release the binary does not claim to be.)" >&2
            exit 1
          fi

          # A tag with a hyphen is a pre-release (v0.1.0-rc.1) and must NOT move `latest`:
          # `docker pull …:latest` after an rc would quietly hand people the release candidate.
          case "$tag" in
            *-*) echo "prerelease=true"  >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "::notice::releasing $tag (version $version)"

  # ---- 1. Cross-platform CLI binaries ----------------------------------------
  binaries:
    needs: tag
    name: binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on the OLDEST supported runner on purpose. A gnu target links the runner's
          # glibc, and a binary linked against 2.39 (ubuntu-latest, 24.04) dies on Debian bookworm
          # (2.36) with `libc.so.6: version GLIBC_2.39 not found`. 22.04 gives glibc 2.35, which
          # runs on bookworm and everything newer. docker/Dockerfile learned this the hard way and
          # says so in a comment; the release matrix walked straight into it anyway.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          # The installer maps Linux/aarch64 to this target, so it must exist or the one-liner
          # dies on every ARM box — and ARM Linux is no longer a corner (Pi, ARM cloud, WSL).
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "api"

      # Vendored libgit2 + OpenSSL build deps (compiled from source).
      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake make perl gcc
      - name: Install build deps (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake

      # The monitor is baked into the binary (FEAT-084), so the web build comes FIRST — otherwise
      # `build.rs` finds no web/dist, embeds nothing, and the release ships an executable whose
      # only symptom is a blank page. The size check below is what stops that shipping silently.
      - name: Build the web monitor
        working-directory: web
        run: npm ci && npm run build

      # Stamp the commit this release was built from, so `kanbanr --version` names the same SHA
      # the GitHub release page shows (FEAT-088). Passed explicitly rather than left to build.rs's
      # `git rev-parse`, because a shallow or exported checkout can leave that answering "unknown"
      # and a provenance string that silently degrades is worse than none.
      - name: Build CLI
        env:
          KANBANR_GIT_SHA: ${{ github.sha }}
        run: cargo build --release -p kanbanr-cli --target ${{ matrix.target }}

      # The binary must be able to say which build it is. A release whose binaries report "unknown"
      # cannot be matched against the release page, which is the whole point of stamping it.
      - name: The binary names the commit it was built from
        shell: bash
        run: |
          set -eu
          bin="target/${{ matrix.target }}/release/kanbanr"
          [ -f "$bin" ] || bin="$bin.exe"
          # Cross-built targets may not run here; only check when the host can execute it.
          if "$bin" --version >/dev/null 2>&1; then
            v="$("$bin" --version)"
            echo "$v"
            echo "$v" | grep -q "${GITHUB_SHA:0:12}" \
              || { echo "::error::--version does not name this commit: $v" >&2; exit 1; }
            case "$v" in
              *dirty*|*unknown*)
                echo "::error::a release binary must not report a dirty or unknown build: $v" >&2
                exit 1 ;;
            esac
          else
            echo "not executable on this runner (cross-build) — skipped"
          fi

      # An assertion, not a note: a binary this small did not embed the monitor. FEAT-084/R-5 caps
      # it the other way, so the two together pin the size to "the SPA is in there, compressed".
      - name: Check the monitor is embedded, and compressed
        shell: bash
        run: |
          set -eu
          bin="target/${{ matrix.target }}/release/kanbanr"
          [ -f "$bin" ] || bin="$bin.exe"
          size=$(wc -c < "$bin")
          echo "binary: $size bytes"
          if [ "$size" -lt 12000000 ]; then
            echo "::error::$bin is ${size}B — too small to contain the web monitor." >&2
            exit 1
          fi
          if [ "$size" -gt 20000000 ]; then
            echo "::error::$bin is ${size}B — the assets look uncompressed (FEAT-084/R-5)." >&2
            exit 1
          fi

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          bin="target/${{ matrix.target }}/release/kanbanr"
          tar -C "$(dirname "$bin")" -czf "kanbanr-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" kanbanr
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "target/${{ matrix.target }}/release/kanbanr.exe"
          Compress-Archive -Path $bin -DestinationPath "kanbanr-${{ github.ref_name }}-${{ matrix.target }}.zip"

      # Staged as an artifact rather than pushed straight to the release, so ONE later job can see
      # every asset at once and checksum them together. SHA256SUMS computed per-leg would be five
      # files that each cover a fifth of the release, which is not what a verifier expects.
      # `SHA256SUMS` covers the ARCHIVES, so it cannot answer "is the binary I am running the
      # current one?" — the running binary is the extracted file, not the tarball. Publishing the
      # binary's own hash keeps `self-update --check` cheap: two small files instead of a
      # multi-megabyte download to answer a question (FEAT-088).
      - name: Publish the binary's own checksum
        shell: bash
        run: |
          set -eu
          bin="target/${{ matrix.target }}/release/kanbanr"
          [ -f "$bin" ] || bin="$bin.exe"
          out="kanbanr-${{ github.ref_name }}-${{ matrix.target }}.bin.sha256"
          if command -v sha256sum >/dev/null; then
            sha256sum "$bin" | awk '{print $1}' > "$out"
          else
            shasum -a 256 "$bin" | awk '{print $1}' > "$out"
          fi
          cat "$out"

      - name: Stage the archive
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            api/kanbanr-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
            api/kanbanr-${{ github.ref_name }}-${{ matrix.target }}.zip
            api/kanbanr-${{ github.ref_name }}-${{ matrix.target }}.bin.sha256
          if-no-files-found: ignore

  # ---- 1b. The release itself: archives + installers + SHA256SUMS -----------
  # The INSTALLERS ship as release assets, so the documented one-liner is served from the
  # release-download host rather than raw.githubusercontent.com — which rate-limits, and which,
  # being a CDN of the default branch, would hand out an installer that may not match the release
  # it is installing. From here the script and the binaries it fetches are one artifact set,
  # versioned together.
  release:
    name: publish the release
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: staged
          pattern: dist-*
          merge-multiple: true

      - name: Stage the installers beside the binaries
        run: cp scripts/install.sh scripts/install.ps1 staged/

      # Bare filenames — no `./` prefix, no directories — so a consumer can run
      # `sha256sum --ignore-missing -c SHA256SUMS` from the directory it downloaded into, which is
      # exactly what scripts/install.sh does.
      - name: Compute SHA256SUMS
        working-directory: staged
        run: |
          set -eu
          rm -f SHA256SUMS
          sha256sum -- * > ../SHA256SUMS
          mv ../SHA256SUMS .
          cat SHA256SUMS

      - name: Create the release and upload every asset
        uses: softprops/action-gh-release@v2
        with:
          files: staged/*
          fail_on_unmatched_files: false
          generate_release_notes: true

  # ---- 1c. Prove the one-liner actually works --------------------------------
  # Staging the installer as an asset makes it *available*; it does not make it *work*. This runs
  # the published script exactly as the README tells a stranger to, in a container with nothing
  # preinstalled, and then asserts the thing the install is FOR: that `kanbanr serve` shows the
  # monitor with no --ui-dir and no build step. A release that fails here is worse than no release,
  # because the failure lands on whoever tried it first.
  verify-install:
    name: verify the installer (${{ matrix.image }})
    needs: release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Two distros, chosen to bracket the glibc range the gnu target has to satisfy:
        # bookworm is 2.36 (the oldest we claim) and ubuntu 24.04 is 2.39 (current). A binary
        # built on too new a runner passes the second and fails the first, which is the whole
        # reason this job exists rather than trusting that a build implies a working install.
        image: ["debian:bookworm-slim", "ubuntu:24.04"]
    container: ${{ matrix.image }}
    steps:
      - name: Minimal prerequisites (as a stranger would have)
        run: |
          set -eu
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates

      - name: Run the published installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/install.sh" \
            | sh -s -- --version "${GITHUB_REF_NAME}" --dir /usr/local/bin

      - name: It installed, and it names both the version and the commit
        run: |
          set -eu
          v="$(kanbanr --version)"
          echo "$v"
          echo "$v" | grep -q "$(echo "${GITHUB_REF_NAME}" | sed 's/^v//')" \
            || { echo "::error::--version does not name the released version: $v" >&2; exit 1; }
          # The same SHA the release page shows, so an installed binary can be matched against it.
          echo "$v" | grep -q "${GITHUB_SHA:0:12}" \
            || { echo "::error::--version does not name the released commit: $v" >&2; exit 1; }

      - name: The monitor is served with no --ui-dir and no build step
        run: |
          set -eu
          # --data-dir given, so it does not ask; --no-hooks because there is no Claude Code here.
          kanbanr init ci-check --data-dir /tmp/board --no-hooks \
            --author "CI" --email "ci@kanbanr.local"
          kanbanr serve --data-dir /tmp/board --bind 127.0.0.1:8080 &
          for _ in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:8080/healthz 2>/dev/null && break
            sleep 1
          done
          body="$(curl -fsS http://127.0.0.1:8080/)"
          echo "$body" | grep -q "/assets/" \
            || { echo "::error::the installed binary served no monitor — the embed did not ship" >&2; exit 1; }
          asset="$(echo "$body" | sed -n 's|.*src="/assets/\([^"]*\)".*|\1|p' | head -n1)"
          [ -n "$asset" ] || { echo "::error::index.html names no bundle" >&2; exit 1; }
          curl -fsS -o /dev/null "http://127.0.0.1:8080/assets/${asset}" \
            || { echo "::error::the bundle the index names is not served" >&2; exit 1; }
          echo "installed from a one-liner, monitor served, bundle intact."

  # ---- 2. Docker image to GHCR ----------------------------------------------
  image:
    name: docker image (GHCR)
    needs: tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          # `latest` is deliberately conditional: a pre-release must not become what an
          # unqualified `docker pull` gives you.
          tags: |
            ${{ steps.img.outputs.name }}:${{ github.ref_name }}
            ${{ needs.tag.outputs.prerelease == 'false' && format('{0}:latest', steps.img.outputs.name) || '' }}

  # ---- 3. Publish the standalone library to crates.io (optional) ------------
  crates:
    name: publish ears-classifier to crates.io
    needs: tag
    runs-on: ubuntu-latest
    # Only runs if you've added the CARGO_REGISTRY_TOKEN secret. Remove this guard if you
    # switch to Trusted Publishing (OIDC), which needs no secret.
    if: ${{ vars.PUBLISH_CRATES == 'true' }}
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # ears-classifier has one dependency and no C in its tree, so none of the vendored-libgit2
      # build toolchain the other crates need applies here.

      # ONLY the standalone crate. Deliberately not kanbanr-cli: a `cargo install` of it cannot
      # carry the built web assets, so it would hand someone a binary whose monitor is missing —
      # a worse first experience than not being on crates.io at all (ADR-0009). And not
      # kanbanr-core: it is this tool's internals, and publishing it promises an API stability we
      # do not want to owe. The binary's distribution channel is the release archive and the
      # installer; crates.io carries the piece that is useful to someone who will never run
      # kanbanr.
      #
      # IDEMPOTENT, and it has to be. A crates.io version is immutable — it can never be
      # published twice — while this job can absolutely run twice: a re-released tag through
      # workflow_dispatch, or a release retried after a later job failed. So an already-published
      # version is a SUCCESS here, not a failure. ONLY that error is tolerated; every other
      # publish failure still fails the job, because "publish errors are fine" is how a broken
      # release ships quietly.
      #
      # The token goes through CARGO_REGISTRY_TOKEN rather than `--token`, which cargo now warns
      # is deprecated.
      - name: Publish ears-classifier
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -eu
          if out="$(cargo publish --locked -p ears-classifier 2>&1)"; then
            echo "$out"
            echo "::notice::ears-classifier published."
          else
            echo "$out"
            case "$out" in
              *"already exists on crates.io"*|*"already uploaded"*)
                echo "::notice::ears-classifier is already published at this version — nothing to do." ;;
              *)
                echo "::error::ears-classifier failed to publish."
                exit 1 ;;
            esac
          fi

name: Release

# Runs when you push a version tag, e.g.  git tag v0.1.0 && git push origin v0.1.0
#
# Produces, for that tag:
#   1. cross-platform `kanbanr` binaries attached to a GitHub Release
#   2. a multi-arch-capable Docker image pushed to GHCR (ghcr.io/startr-trade/kanbanr)
#   3. (optional) the CLI published to crates.io
#
# Secrets/setup required (see docs/OPEN_SOURCING.md → "Accounts, keys & credentials"):
#   - GHCR: none — uses the automatic GITHUB_TOKEN (needs `packages: write`, set below).
#   - crates.io: set repo secret CARGO_REGISTRY_TOKEN, OR configure Trusted Publishing and
#     drop the token line. The publish job is skipped automatically if the secret is absent.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the GitHub Release + upload assets
  packages: write   # push to GHCR

jobs:
  # ---- 1. Cross-platform CLI binaries ----------------------------------------
  binaries:
    name: binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "api"

      # Vendored libgit2 + OpenSSL build deps (compiled from source).
      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake make perl gcc
      - name: Install build deps (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake

      - name: Build CLI
        run: cargo build --release -p kanbanr-cli --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          bin="target/${{ matrix.target }}/release/kanbanr"
          tar -C "$(dirname "$bin")" -czf "kanbanr-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" kanbanr
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "target/${{ matrix.target }}/release/kanbanr.exe"
          Compress-Archive -Path $bin -DestinationPath "kanbanr-${{ github.ref_name }}-${{ matrix.target }}.zip"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            api/kanbanr-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
            api/kanbanr-${{ github.ref_name }}-${{ matrix.target }}.zip
          fail_on_unmatched_files: false
          generate_release_notes: true

  # ---- 2. Docker image to GHCR ----------------------------------------------
  image:
    name: docker image (GHCR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ github.ref_name }}
            ${{ steps.img.outputs.name }}:latest

  # ---- 3. Publish CLI to crates.io (optional) -------------------------------
  crates:
    name: publish to crates.io
    runs-on: ubuntu-latest
    # Only runs if you've added the CARGO_REGISTRY_TOKEN secret. Remove this guard if you
    # switch to Trusted Publishing (OIDC), which needs no secret.
    if: ${{ vars.PUBLISH_CRATES == 'true' }}
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y cmake make perl gcc
      # Publish in dependency order: core before the CLI that depends on it.
      - name: Publish kanbanr-core
        run: cargo publish -p kanbanr-core --token "${{ secrets.CARGO_REGISTRY_TOKEN }}" || true
      - name: Publish kanbanr-cli
        run: cargo publish -p kanbanr-cli --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"

# cargo-deny policy (FEAT-130). Run with `cd api && cargo deny check`, or `make audit`; CI runs it
# in ci.yml's supply-chain job and fails on any violation.

[graph]
all-features = false

[advisories]
version = 2
# Vulnerabilities, unsound and unmaintained crates all fail. The one sanctioned exception is a
# finding with no fix anyone can reach, listed here with its reason and the item tracking it —
# never silently. None today.
ignore = []

[licenses]
version = 2
# Permissive licences only, matching THIRD_PARTY.md. A crate offering a choice (`MIT OR LGPL…`)
# passes on the permissive side; anything else needs a deliberate decision recorded here.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# Duplicate versions are reported, not refused: several are forced by the ecosystem (windows-sys,
# getrandom) and cannot be fixed here.
multiple-versions = "warn"
wildcards = "deny"
# Our own crates depend on each other by path; they are never published (ADR-0011).
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

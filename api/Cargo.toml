[workspace]
resolver = "2"
members = [
    # Standalone and published on its own: EARS classification and the ISO 25010 vocabulary have
    # no kanbanr in them and are useful to anyone writing requirements down.
    "crates/ears-classifier",
    "crates/kanbanr-core",
    "crates/kanbanr-cli",
    "crates/kanbanr-server",
]

[workspace.package]
version = "0.1.4"
edition = "2024"
# The minimum that compiles, which is a promise to anyone building this — not the version we
# develop on (see rust-toolchain.toml). Edition 2024 needs 1.85; the let-chains clippy applied need 1.88.
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["the kanbanr authors"]
repository = "https://github.com/startr-trade/kanbanr"
description = "Kanban task manager for Claude-driven development: a git-backed CLI writer + read-only live monitor"

[workspace.dependencies]
kanbanr-core = { path = "crates/kanbanr-core" }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
anyhow = "1"
thiserror = "1"
time = { version = "0.3", features = ["formatting", "macros"] }

[profile.release]
opt-level = 2
# A release ships without its symbol table (FEAT-142). Adding the SSH and HTTPS transports grew the
# binary past release.yml's ceiling, which is there to catch an uncompressed monitor; the symbols
# were most of the growth's worth of dead weight. Debug info was already left out of release builds.
strip = "symbols"

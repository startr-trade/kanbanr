          - {kind: practice, text: "The pipeline runs lint, tests, build, integration, scan and publish in that order, each a job rerunnable alone, with artifacts passed between them"}
          - {kind: practice, text: Cache keys come from the lock files and caches are saved from main only}
          - {kind: practice, text: Every job has a timeout and a superseded run is cancelled}
        adds: *pipeline-adds
      - id: none-yet
        label: None yet
        why: TODO(P12)
        fits_when: TODO(P12)
        costs: TODO(P12)


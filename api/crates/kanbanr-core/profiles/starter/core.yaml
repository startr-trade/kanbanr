        records:
          - {kind: constraint, text: Containers on a host run the product}
          - {kind: non_goal, text: "No Kubernetes: containers run on a host with Compose"}
      - id: kubernetes
        label: Kubernetes
        why: TODO(P12)
        fits_when: TODO(P12)
        costs: TODO(P12)
        mentions: [Kubernetes, k8s, Helm]

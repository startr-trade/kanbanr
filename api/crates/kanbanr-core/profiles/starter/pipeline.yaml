# How the pipeline is shaped, where it runs, and its test tiers.
# Every option teaches: its `why`, `fits_when` and `costs` are shown when the area is asked.
profile:
  name: pipeline
  description: How the pipelines are split, where they run, and the test tiers
  version: 1
  requires: [core]
areas:
  - id: pipeline-shape
    title: The pipeline's shape
    asks: first_need
    when: {area: delivery, options: [github-actions, bitbucket-pipelines, gitlab-ci, other]}
    touches: [pipeline, workflow, job, trigger, schedule, tag, scan, Trivy, CodeQL, release]
    question: How are the pipelines split?
    options:
      - id: split-by-trigger
        label: Split by trigger
        recommended: true
        why: "Each trigger has its own pipeline: CI on every push, scanning on a schedule and on dependency changes, the release on a tag"
        fits_when: "Any project with scans or a release step, which is most"
        costs: "Several workflow files to keep consistent"
        mentions: [CI on push, scanning on schedule and dependency change, release on tag]
        records:
          - {kind: practice, text: "Pipelines are split by trigger: CI on every push, dependency and image scanning on a schedule and on dependency changes, release on a tag; each job is rerunnable alone and a green result is reused until the code it covers changes"}
      - id: single-pipeline
        label: One pipeline
        why: "One workflow runs every stage on every trigger"
        fits_when: "Small projects with fast checks and no separate scans"
        costs: "Slow scans run on every push unless the cache skips them; one edit to the file affects every run"
        mentions: [one workflow]
        records:
          - {kind: practice, text: "One workflow runs every stage; stages that did not change are skipped by cache"}

  - id: runners
    title: Runners
    asks: first_need
    select: many
    when: {area: delivery, options: [github-actions, bitbucket-pipelines, gitlab-ci, other]}
    touches: [runner, self-hosted, hosted, agent, build machine]
    question: Which runners run the pipeline?
    options:
      - id: hosted-runners
        label: Hosted runners
        recommended: true
        why: "The CI service's own machines run the jobs"
        fits_when: "Most projects: there are no build machines to maintain"
        costs: "The plan's minutes, machine sizes and limits; the runners reach only what the service exposes"
        mentions: [hosted runners]
        records:
          - {kind: constraint, text: "The pipeline runs on the CI service's hosted runners", why: "The account's limits and the secrets the runners can reach"}
      - id: self-hosted-runners
        label: Self-hosted runners
        why: "Machines the team runs execute the jobs, where the answer says"
        fits_when: "Builds that need more power, special hardware, or access to a private network"
        costs: "Machines to patch, secure and clean between jobs; a runner that can reach secrets must be trusted"
        mentions: [self-hosted, own runners]
        asks_value: where they run
        records:
          - {kind: constraint, text: "The pipeline runs on self-hosted runners in {value}", why: "The account's limits and the secrets the runners can reach"}

  - id: ci-tiers
    title: CI tiers
    asks: first_need
    when: {area: delivery, options: [github-actions, bitbucket-pipelines, gitlab-ci, other]}
    touches: [test tier, slow tests, integration tests, make ci, nightly, release gate]
    question: How are the tests tiered?
    options:
      - id: fast-then-full
        label: A fast tier, then a full tier
        why: "A fast tier runs on every landing, and the full tier before a release"
        fits_when: "A test suite that takes more than a few minutes in full"
        costs: "Deciding which tests are fast; a slow test's failure may show only before a release"
        mentions: [fast tier, full tier]
        records:
          - {kind: practice, text: "The same checks run locally (`make ci`) and in CI: the fast tier on every landing, the full tier before a release"}
      - id: single-tier
        label: One tier
        why: "Every check runs on every landing"
        fits_when: "A test suite fast enough to run in full every time"
        costs: "Each landing waits longer as the suite grows"
        records:
          - {kind: practice, text: "The same checks run locally (`make ci`) and in CI, all of them on every landing"}

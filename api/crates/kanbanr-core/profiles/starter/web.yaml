# The screens: their style, how the web app ships, its origins, browser tests and dev exposure.
# `why`, `fits_when` and `costs` marked TODO(P12) are written by FTR-033 P12.
profile:
  name: web
  description: UI style, web packaging, origins, browser tests and exposing a dev instance
  version: 1
  requires: [core]
areas:
  - id: ui-style
    title: UI style
    asks: first_need
    select: many
    when: {area: project-kind, options: [screen, both]}
    touches: [screen, page, form, component, "*.tsx", "*.jsx", "*.vue", "*.svelte", "*.css", "*.html"]
    question: How are the screens built and styled?
    options:
      - id: component-library
        label: A component library
        why: TODO(P12)
        fits_when: TODO(P12)
        costs: TODO(P12)
        mentions: [component library, MUI, Chakra, shadcn, Vuetify, Ant]
        asks_value: the library
        records:
          - {kind: constraint, text: "Screens are built with {value}"}
          - &visual {kind: practice, text: "A screen's design names its components and the visual direction: the feel, colours or brand, and a site it should resemble"}
      - id: utility-classes
        label: Utility classes
        why: TODO(P12)
        fits_when: TODO(P12)
        costs: TODO(P12)
        mentions: [Tailwind, utility class]
        records:
          - {kind: constraint, text: "Screens are built with {label}"}
          - *visual
      - id: hand-written-css
        label: Hand-written CSS
        why: TODO(P12)
        fits_when: TODO(P12)
        costs: TODO(P12)
        mentions: [hand-written CSS, plain CSS]
        records:
          - {kind: constraint, text: "Screens are built with {label}"}
          - *visual
      - id: design-system
        label: A design system
        why: TODO(P12)
        fits_when: TODO(P12)
        costs: TODO(P12)
        mentions: [design system]
        asks_value: where it lives
        records:
          - {kind: constraint, text: "Screens are built with the design system in {value}"}
          - *visual

  - id: web-packaging
    title: How the web app ships
    asks: first_need
    when: {area: project-kind, options: [screen, both]}
    touches: [bundle, static files, dist/, port, image, serve, embed]
    question: How is the web app served?
    options:
      - id: served-by-the-service
        label: Served by the service itself
        recommended: true
        why: TODO(P12)
        fits_when: TODO(P12)
        costs: TODO(P12)
        mentions: [one process, one port, embedded assets]
        records:
          - {kind: constraint, text: The web app is served by the service itself on one port}
          - &one-port {kind: practice, text: "Every web interaction goes through the one public port; nothing else is exposed"}
      - id: separate-image
        label: Its own image
        why: TODO(P12)
        fits_when: TODO(P12)
        costs: TODO(P12)
        mentions: [separate web image, nginx image]
        records:
          - {kind: constraint, text: The web app ships as its own image}
          - *one-port
      - id: static-hosting
        label: Static hosting
        why: TODO(P12)
        fits_when: TODO(P12)
        costs: TODO(P12)
        mentions: [static hosting, CDN, object storage]
        asks_value: the host
        records:
          - {kind: constraint, text: "The web app is static files on {value}"}
          - *one-port

  - id: web-origins
    title: Origins and CORS
    asks: first_need
    when: {area: project-kind, options: [screen, both]}
    touches: [CORS, origin, cross-origin, Access-Control, fetch, cookie, SameSite]
    question: Which origins may call the API?
    options:
      - id: same-origin
        label: The same origin only
        recommended: true
        why: TODO(P12)
        fits_when: TODO(P12)
        costs: TODO(P12)
        mentions: [same origin, no CORS]
        records:
          - {kind: constraint, text: "The web app and its API share one origin; CORS is off"}
      - id: allowed-origins
        label: An allow-list of origins
        why: TODO(P12)
        fits_when: TODO(P12)
        costs: TODO(P12)
        mentions: [CORS allow-list]
        asks_value: the origins
        records:
          - {kind: constraint, text: "CORS allows {value} and nothing else, from configuration"}
      - id: public-api
        label: Any origin
        why: TODO(P12)
        fits_when: TODO(P12)
        costs: TODO(P12)
        mentions: [any origin]
        records:
          - {kind: constraint, text: "The API answers any origin; credentials are never cookies"}

  - id: e2e-tests
    title: Browser tests
    asks: first_need
    when: {area: project-kind, options: [screen, both]}
    touches: [end-to-end, browser test, Playwright, Cypress, "*.spec.ts", e2e]
    question: How are the screens tested end to end?
    options:
      - id: browser-tests-in-ci
        label: Browser tests in CI
        recommended: true
        why: TODO(P12)
        fits_when: TODO(P12)
        costs: TODO(P12)
        mentions: [Playwright, Cypress, browser tests]
        asks_value: the runner
        records:
          - {kind: practice, text: "Browser tests run with {value} in the pipeline's full tier and their results are captured as evidence"}
      - id: browser-tests-local-only
        label: Browser tests, run locally
        why: TODO(P12)
        fits_when: TODO(P12)
        costs: TODO(P12)
        mentions: [local only]
        records:
          - {kind: practice, text: "Browser tests run before a release, by hand, and their results are recorded"}
      - id: none
        label: No browser tests
        why: TODO(P12)
        fits_when: TODO(P12)
        costs: TODO(P12)
        records:
          - {kind: non_goal, text: "No browser tests: screens are checked by a person"}

  - id: dev-exposure
    title: Exposing a development instance
    asks: first_need
    when: {area: project-kind, options: [screen, service, both]}
    touches: [tunnel, ngrok, cloudflared, expose, webhook, callback, test from a phone]
    question: Is a development instance ever exposed outside the machine?
    options:
      - id: tunnel
        label: Through a tunnel
        why: TODO(P12)
        fits_when: TODO(P12)
        costs: TODO(P12)
        mentions: [ngrok, cloudflared, tunnel]
        asks_value: the tool
        records:
          - {kind: practice, text: "The runbook says how to expose a development instance through {value} for testing webhooks or devices, and that a tunnel is never left running"}
      - id: none
        label: Never
        recommended: true
        why: TODO(P12)
        fits_when: TODO(P12)
        costs: TODO(P12)
        records:
          - {kind: non_goal, text: No development instance is exposed outside the machine}

# Where infrastructure state lives, and how environments differ.
# Every option teaches: its `why`, `fits_when` and `costs` are shown when the area is asked.
profile:
  name: infra
  description: Infrastructure state and environments
  version: 1
  requires: [core]
areas:
  - id: infra-state-environments
    title: Infrastructure state and environments
    asks: first_need
    when: {area: iac, options: [opentofu, terraform, pulumi, cloud-native]}
    touches: [state, workspace, environment, staging, production, "*.tfvars"]
    question: Where does infrastructure state live?
    options:
      - id: remote-state-per-environment
        label: Remote state, one per environment
        why: "State is kept in a shared, locked backend, one for each environment"
        fits_when: "More than one person or the pipeline applies changes, or there is more than one environment"
        costs: "A backend to set up and protect, since state can hold secrets"
        mentions: [remote state, workspace]
        records:
          - {kind: constraint, text: "Infrastructure state is remote, one per environment"}
          - &modules {kind: practice, text: Environments are the same modules with different variables}
      - id: local-state
        label: Local state
        why: "State is kept in a file on the machine that applies it"
        fits_when: "One person and one environment, while experimenting"
        costs: "Lost with the machine; two people applying at once can corrupt it"
        records:
          - {kind: constraint, text: Infrastructure state is kept locally}
          - *modules

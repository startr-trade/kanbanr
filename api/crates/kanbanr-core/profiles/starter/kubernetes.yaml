# How workloads are packaged for Kubernetes.
# Every option teaches: its `why`, `fits_when` and `costs` are shown when the area is asked.
profile:
  name: kubernetes
  description: How the workloads are packaged for Kubernetes
  version: 1
  requires: [core]
areas:
  - id: kubernetes
    title: Kubernetes
    asks: first_need
    when: {area: runs-where, options: [kubernetes]}
    touches: [manifest, Helm, Kustomize, Chart.yaml, "kind: Deployment", namespace, ingress, Pod]
    question: How are the workloads packaged?
    options:
      - id: helm
        label: Helm
        why: "A Helm chart packages the workloads, with templates and values for each environment"
        fits_when: "Products others install, or many environments with different settings"
        costs: "Templates are harder to read and review than plain YAML"
        mentions: [Helm, chart]
        records: &workloads
          - {kind: constraint, text: "{label} packages the workloads"}
          - &requests-limits {kind: practice, text: "Every workload sets requests and limits, a readiness probe and a non-root security context"}
      - id: kustomize
        label: Kustomize
        why: "Kustomize builds each environment's manifests from a base and overlays"
        fits_when: "The team deploys its own workloads to a few environments"
        costs: "Nothing packaged or versioned for others to install"
        mentions: [Kustomize]
        records: *workloads
      - id: plain-manifests
        label: Plain manifests
        why: "Plain YAML manifests describe the workloads"
        fits_when: "One environment and a few workloads"
        costs: "Each environment's differences are copied by hand"
        mentions: [manifests]
        records:
          - {kind: constraint, text: Plain manifests package the workloads}
          - *requests-limits

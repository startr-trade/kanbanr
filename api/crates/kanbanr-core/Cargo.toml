[package]
name = "kanbanr-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Engine for kanbanr: YAML/markdown store, dispatch router, git-backed commits, validation"
# kanbanr ships as release archives, installers and an image — never as a crate (FEAT-024).
publish = false

[dependencies]
# Extracted and published separately (FEAT-092): the EARS/ISO vocabulary is not kanbanr-specific.
ears-classifier = { path = "../ears-classifier", version = "0.1.0" }
serde.workspace = true
serde_yaml.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
# Git-backed data folder (shared by the server and the CLI's local mode). vendored-libgit2 +
# vendored-openssl compile the C deps from source and link them statically, so neither the build
# host nor the runtime needs git/libgit2 installed.
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2", "vendored-openssl", "ssh", "https"] }
# The published read-API description (FEAT-177): response types derive their JSON Schema only when
# asked, so the binary carries none of it. The OpenAPI document is generated with
# `cargo run -p kanbanr-core --features schema --example openapi`, committed, and served as bytes.
schemars = { version = "1", optional = true }

[features]
schema = ["dep:schemars"]

[[example]]
name = "openapi"
required-features = ["schema"]

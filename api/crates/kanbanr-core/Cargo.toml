[package]
name = "kanbanr-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Engine for kanbanr: YAML/markdown store, dispatch router, git-backed commits, validation"

[dependencies]
serde.workspace = true
serde_yaml.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
# Git-backed data folder (shared by the server and the CLI's local mode). vendored-libgit2 +
# vendored-openssl compile the C deps from source and link them statically, so neither the build
# host nor the runtime needs git/libgit2 installed.
git2 = { version = "0.19", default-features = false, features = ["vendored-libgit2", "vendored-openssl"] }

[package]
name = "kanbanr-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "kanbanr CLI: a git-backed kanban writer for Claude-driven development, plus a read-only live monitor"
# kanbanr ships as release archives, installers and an image — never as a crate (FEAT-024).
publish = false

# The single kanbanr runtime: a local-only writer that also runs the view daemon via `kanbanr serve`.
[[bin]]
name = "kanbanr"
path = "src/main.rs"

[dependencies]
# The CLI writes the data folder directly (store + dispatch + git) — it IS the writer.
kanbanr-core.workspace = true
# The view daemon (read API + SSE + SPA), run in-process by `kanbanr serve` — one binary.
kanbanr-server = { path = "../kanbanr-server" }
serde.workspace = true
# preserve_order: `kanbanr hooks install` edits the user's Claude settings without reordering keys.
serde_json = { workspace = true, features = ["preserve_order"] }
# `charter set` / `feature define` accept YAML or JSON from a file or stdin (YAML parses both).
serde_yaml.workspace = true
clap = { version = "4", features = ["derive"] }
anyhow.workspace = true
# `serve` needs an async runtime to host the view daemon.
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# Used by `kanbanr open` to check whether the view daemon is already running.
# TLS is not optional for this binary any more (FEAT-088). `default-features = false` with no tls
# feature left ureq with no backend at all — base64, log, once_cell, url — so every https:// call
# failed, self-update included, and the webhook sender could never have reached an https endpoint.
# rustls rather than native-tls: reusing the OpenSSL git2 vendors would couple this client's TLS to
# libgit2's build configuration on three platforms, to save about a megabyte against the 20 MB
# ceiling ADR-0009 set.
ureq = { version = "2", default-features = false, features = ["tls", "json", "gzip"] }
# The running binary's own checksum, compared against what the release publishes (FEAT-088/R-1).
sha2 = "0.10"
# Unpack a release archive in memory during self-update (FEAT-088); flate2 is already in the
# tree via the server crate, which gzips the embedded monitor.
tar = "0.4"
flate2 = "1"
# Cross-process advisory file lock so two concurrent writers can't interleave a mutate→commit
# sequence on the same data dir (FEAT-029).
fs2 = "0.4"

[dev-dependencies]
# Spin up the built Docker image to integration-test the view daemon end-to-end.
# `blocking` provides the synchronous SyncRunner used by the tests.
testcontainers = { version = "0.23", features = ["blocking"] }
# FEAT-034 unit tests inspect the data repo's commit log directly (vendored, matches kanbanr-core).
git2 = { version = "0.19", default-features = false, features = ["vendored-libgit2", "vendored-openssl"] }

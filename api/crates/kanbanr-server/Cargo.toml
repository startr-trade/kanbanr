[package]
name = "kanbanr-server"
version.workspace = true
edition.workspace = true
license.workspace = true

# A LIBRARY: the view daemon (`run()`), used by the single `kanbanr` binary via `kanbanr serve`.
[lib]
name = "kanbanr_server"
path = "src/lib.rs"

[dependencies]
kanbanr-core.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "fs", "trace"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
notify = "6"
# No auth/JWT and no direct git2: the view daemon only reads (via kanbanr-core); writes + git live
# in the CLI's local mode.

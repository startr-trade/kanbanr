[package]
name = "kanbanr-server"
version.workspace = true
edition.workspace = true
license.workspace = true

# A LIBRARY: the view daemon (`run()`), used by the single `kanbanr` binary via `kanbanr serve`.
[lib]
name = "kanbanr_server"
path = "src/lib.rs"

[dependencies]
kanbanr-core.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "fs", "trace"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
notify = "6"
# FEAT-034: the optional single-writer daemon (`serve --allow-writes`) needs the same cross-process
# advisory write lock the CLI uses, so concurrent writers (CLI + daemon) never interleave a
# mutate→commit sequence on the same data dir. git itself stays in kanbanr-core (commit + push).
fs2 = "0.4"
# Auth/JWT remains absent: the daemon binds localhost and has no accounts, consistent with the
# read-only monitor. git2 is NOT a direct dep — commit/push go through kanbanr-core::git.

[dev-dependencies]
# FEAT-034 write-path tests inspect the data repo's commit log directly (matches kanbanr-core).
git2 = { version = "0.19", default-features = false, features = ["vendored-libgit2", "vendored-openssl"] }

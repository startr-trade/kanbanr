# Single service: the kanbanr server serves both the API and the React monitor SPA.
#
# The board folder is mounted so the container sees exactly what the CLI writes. Compose cannot run
# a command to find it, so pass it in — the `.kanbanr` marker is the authority and the CLI reads it:
#
#     KANBANR_DATA_DIR="$(kanbanr where)" docker compose -f docker/docker-compose.yml up
#
# `make docker-up` does that for you. The default below is only the conventional layout for a fresh
# clone; a board named for its owner rather than for the repo will not match it.
services:
  kanbanr:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: kanbanr:latest
    container_name: kanbanr
    ports:
      - "18080:8080"
    volumes:
      # Host board (written by the CLI) <-> container data dir (read by the server). A sibling of
      # the repo, never a folder inside it (FEAT-041).
      - ${KANBANR_DATA_DIR:-../../kanbanr.kanbanr}:/data
    restart: unless-stopped

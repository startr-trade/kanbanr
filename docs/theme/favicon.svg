<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="kanbanr">
  <!-- Favicon cut of the k-mark: solid cards, heavier arms, so the column and the saffron
       done-dot still read at 16 px. Theme-aware via prefers-color-scheme. -->
  <style>
    .ink  { stroke: #26317E; fill: #26317E; }
    .arm  { stroke: #26317E; }
    .ring { stroke: #26317E; fill: #FFFFFF; }
    @media (prefers-color-scheme: dark) {
      .ink  { stroke: #AEB6E8; fill: #AEB6E8; }
      .arm  { stroke: #AEB6E8; }
      .ring { stroke: #AEB6E8; fill: #0F1117; }
    }
  </style>
  <path class="arm" d="M50 64 L98 24 M50 64 L98 104" fill="none" stroke-width="13" stroke-linecap="round"/>
  <rect class="ink" x="14" y="10"  width="38" height="30" rx="7"/>
  <rect class="ink" x="14" y="49"  width="38" height="30" rx="7"/>
  <rect class="ink" x="14" y="88"  width="38" height="30" rx="7"/>
  <circle class="ring" cx="100" cy="24" r="13" stroke-width="7"/>
  <circle cx="100" cy="104" r="15" fill="#E8871E"/>
</svg>

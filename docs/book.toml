[book]
title = "kanbanr"
description = "A git-backed board that is the system of record for Claude-driven development"
authors = ["The kanbanr Authors"]
language = "en"
src = "src"

[output.html]
default-theme = "rust"
# A diagram in the content column is bounded by that column. `diagram-open.js` opens a click on one
# in its own tab at full size, where the browser's own zoom, scroll, save and print already work —
# no bespoke pan/zoom code to keep alive. The ```mermaid blocks are drawn by Pele in the reader's
# browser (FEAT-203): `pele.global.js` is the pinned build (tools/docs/pele.sh), `pele-init.js`
# draws each block, `pele-theme.css` colours them from the current theme, and `diagrams.css` fits
# them to the column and marks them clickable.
additional-css = ["diagrams.css", "pele-theme.css", "brand.css"]
additional-js = ["pele.global.js", "pele-init.js", "diagram-open.js"]
preferred-dark-theme = "ayu"
git-repository-url = "https://github.com/startr-trade/kanbanr"
edit-url-template = "https://github.com/startr-trade/kanbanr/edit/main/docs/{path}"

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
